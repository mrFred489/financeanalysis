version: '3'

vars:
  BIN_DIR: bin
  WEB_DIR: web
  WEBUI_DIR: internal/webui
  DIST_DIR: '{{.WEBUI_DIR}}/dist'
  BINARY_NAME: financeanalysis
  BINARY_PATH: '{{.BIN_DIR}}/{{.BINARY_NAME}}'
  COMPOSE_FILE: compose.yaml
  # Dev slot configuration. SLOT names an isolated dev environment (default
  # "main"); DATA_DIR points at a completely different data directory and
  # takes precedence over the slot-derived directory. API_PORT/WEB_PORT
  # override the ports derived from the slot/data dir.
  # SLOT_DATA_DIR and DATA_DIR are plain self-referential scalars so that env
  # vars / CLI vars with those names are picked up instead of being shadowed.
  SLOT: '{{.SLOT | default "main"}}'
  DATA_DIR: '{{.DATA_DIR | default ""}}'
  SLOT_DATA_DIR: '{{.SLOT_DATA_DIR | default ""}}'
  # CUSTOM_DATA_DIR is the user-supplied data dir (SLOT_DATA_DIR wins over
  # DATA_DIR), tilde-expanded, or empty when running on a slot-derived dir.
  CUSTOM_DATA_DIR:
    sh: |
      d=""
      if [ -n "{{.SLOT_DATA_DIR}}" ]; then d="{{.SLOT_DATA_DIR}}"
      elif [ -n "{{.DATA_DIR}}" ]; then d="{{.DATA_DIR}}"
      fi
      if [ -n "$d" ]; then
        case "$d" in "~"|"~"/*) d="$HOME${d#?}" ;; esac
        printf '%s\n' "$d"
      fi
  # EFFECTIVE_DATA_DIR is the final data dir: custom dir if given, ./data for
  # the main slot, .dev/<slot> otherwise.
  EFFECTIVE_DATA_DIR:
    sh: |
      if [ -n "{{.CUSTOM_DATA_DIR}}" ]; then
        printf '%s\n' "{{.CUSTOM_DATA_DIR}}"
      elif [ "{{.SLOT}}" = "main" ]; then
        echo "./data"
      else
        echo ".dev/{{.SLOT}}"
      fi
  # Derived ports (do not rename: API_PORT/WEB_PORT below must be able to
  # override these via env or CLI). Ports are hashed from the custom data dir
  # when one is given, otherwise from the slot name.
  DERIVED_API_PORT:
    sh: |
      if [ -n "{{.CUSTOM_DATA_DIR}}" ]; then
        go run ./cmd/devports -path "{{.CUSTOM_DATA_DIR}}" api
      else
        go run ./cmd/devports "{{.SLOT}}" api
      fi
  DERIVED_WEB_PORT:
    sh: |
      if [ -n "{{.CUSTOM_DATA_DIR}}" ]; then
        go run ./cmd/devports -path "{{.CUSTOM_DATA_DIR}}" web
      else
        go run ./cmd/devports "{{.SLOT}}" web
      fi
  API_PORT: '{{.API_PORT | default .DERIVED_API_PORT}}'
  WEB_PORT: '{{.WEB_PORT | default .DERIVED_WEB_PORT}}'

env:
  GOOS: '{{ default "" .GOOS | default (OS) }}'
  GOARCH: '{{ default "" .GOARCH | default (ARCH) }}'

tasks:
  setup:
    desc: Install all dependencies
    cmds:
      - go mod download
      - cd {{.WEB_DIR}} && npm ci
      - npx playwright install chromium
    status:
      - test -f go.mod
      - test -d {{.WEB_DIR}}/node_modules

  dev:
    desc: Run the development server (API in background, web in foreground)
    deps: [generate]
    cmds:
      # Run both at once — dev:api blocks, so it goes to the background.
      # env applies to both commands; run dev:api / dev:web separately in
      # individual terminals if you prefer.
      - go run ./cmd/financeanalysis serve &
      - cd {{.WEB_DIR}} && npm run dev -- --port {{.WEB_PORT}} --strictPort
    env:
      FA_DATA_DIR: '{{.EFFECTIVE_DATA_DIR}}'
      FA_ADDR: '127.0.0.1:{{.API_PORT}}'
      FA_LOG_LEVEL: debug
      VITE_API_URL: 'http://127.0.0.1:{{.API_PORT}}'

  dev:api:
    desc: Run the Go server (slot-aware; see dev:ports)
    cmds:
      - go run ./cmd/financeanalysis serve
    env:
      FA_DATA_DIR: '{{.EFFECTIVE_DATA_DIR}}'
      FA_ADDR: '127.0.0.1:{{.API_PORT}}'
      FA_LOG_LEVEL: debug

  dev:web:
    desc: Run the Vite development server (slot-aware; see dev:ports)
    cmds:
      - cd {{.WEB_DIR}} && npm run dev -- --port {{.WEB_PORT}} --strictPort
    env:
      VITE_API_URL: 'http://127.0.0.1:{{.API_PORT}}'

  dev:ports:
    desc: Print the data dir and URLs for a dev slot without starting servers
    silent: true
    cmds:
      - echo "slot={{.SLOT}} data_dir={{.EFFECTIVE_DATA_DIR}} api=http://127.0.0.1:{{.API_PORT}} web=http://127.0.0.1:{{.WEB_PORT}}"

  dev:reset:
    desc: Delete a dev slot's data directory (main slot and external dirs need CONFIRM=1)
    cmds:
      - |
        if [ "{{.SLOT}}" = "main" ] && [ -z "{{.CUSTOM_DATA_DIR}}" ]; then
          echo "refusing to reset the main slot (set CONFIRM=1 to override)" >&2
          if [ "{{.CONFIRM | default ""}}" != "1" ]; then exit 1; fi
        fi
        case "{{.EFFECTIVE_DATA_DIR}}" in
          .dev/*) ;;
          *)
            echo "refusing to delete {{.EFFECTIVE_DATA_DIR}} outside .dev/ (set CONFIRM=1 to override)" >&2
            if [ "{{.CONFIRM | default ""}}" != "1" ]; then exit 1; fi
            ;;
        esac
        rm -rf "{{.EFFECTIVE_DATA_DIR}}"
        echo "removed {{.EFFECTIVE_DATA_DIR}}"

  generate:
    desc: Generate code (sqlc)
    cmds:
      - go tool sqlc generate
    sources:
      - sqlc.yaml
      - internal/db/queries/*.sql
      - internal/db/migrations/*.sql
    generates:
      - internal/db/dbq/*.go

  build:web:
    desc: Build the frontend for production into internal/webui/dist
    cmds:
      - cd {{.WEB_DIR}} && npm run build
      - mkdir -p {{.DIST_DIR}}
      - cp -r {{.WEB_DIR}}/build/* {{.DIST_DIR}}/
    generates:
      - '{{.DIST_DIR}}/**/*'

  build:
    desc: Build the application
    deps: [generate, build:web]
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - CGO_ENABLED=0 go build -tags embedui -trimpath -ldflags "-s -w -X main.version={{.VERSION | default `dev`}}" -o {{.BINARY_PATH}} ./cmd/financeanalysis
    generates:
      - '{{.BINARY_PATH}}'

  gen:csv:
    desc: Generate high-variance CSV test files for import testing into testdata/generated (gitignored)
    cmds:
      - go run ./cmd/csvgen {{.CLI_ARGS}}

  test:go:
    desc: Run Go tests
    cmds:
      - go test -v ./...

  test:web:
    desc: Run frontend tests
    cmds:
      - cd {{.WEB_DIR}} && npm run test

  test:
    desc: Run all tests
    deps: [test:go, test:web]

  e2e:
    desc: Run end-to-end tests
    deps: [build]
    cmds:
      - mkdir -p testdata/e2e
      - FA_DATA_DIR=testdata/e2e/finance {{.BINARY_PATH}} serve &
      - sleep 2
      - cd {{.WEB_DIR}} && npx playwright test
      - pkill -f {{.BINARY_NAME}} || true
      - rm -rf testdata/e2e

  lint:go:
    desc: Lint Go code
    cmds:
      - go vet ./...
      - go tool staticcheck ./...
      - gofmt -l . | test -z "$(cat -)"

  lint:web:
    desc: Lint frontend code
    cmds:
      - cd {{.WEB_DIR}} && npm run lint
      - cd {{.WEB_DIR}} && npm run check

  lint:
    desc: Run all linters
    deps: [lint:go, lint:web]

  check:generated:
    desc: Check that generated code is up to date
    cmds:
      - go tool sqlc diff

  ci:
    desc: Run CI checks (lint + test + e2e)
    deps: [lint, check:generated, test, e2e]

  docker:build:
    desc: Build the Docker image
    cmds:
      - docker build -t financeanalysis .

  docker:up:
    desc: Start the application with Docker Compose
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up

  docker:down:
    desc: Stop the application
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}
      - rm -rf {{.DIST_DIR}}

  .PHONY:
    - setup
    - dev
    - dev:api
    - dev:web
    - dev:ports
    - dev:reset
    - generate
    - gen:csv
    - build:web
    - build
    - test:go
    - test:web
    - test
    - e2e
    - lint:go
    - lint:web
    - lint
    - check:generated
    - ci
    - docker:build
    - docker:up
    - docker:down
    - clean
