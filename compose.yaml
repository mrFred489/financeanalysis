services:
  financeanalysis:
    build:
      context: .
      dockerfile: Dockerfile
    image: financeanalysis:latest
    container_name: financeanalysis
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - "./data:/data"
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    environment:
      - FA_DATA_DIR=/data
      - FA_ADDR=0.0.0.0:8080
      - FA_LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "/financeanalysis", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
