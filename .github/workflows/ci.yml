name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          go mod download
          cd web && npm ci

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Run CI checks
        run: |
          task setup
          task ci

  docker:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t financeanalysis .

      - name: Test Docker container
        run: |
          mkdir -p testdata
          docker run -d --name financeanalysis-test -p 127.0.0.1:8080:8080 -v $(pwd)/testdata:/data financeanalysis
          sleep 5
          curl -f http://127.0.0.1:8080/api/status
          docker stop financeanalysis-test
          docker rm financeanalysis-test
